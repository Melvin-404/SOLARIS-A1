# SOLARIS-A1 Default Configuration (Stage 4)
# Note: Scientific parameters are uncommitted and marked PENDING pending student decisions.

project:
  name: "SOLARIS-A1"
  stage_status: "Stage 5 (PROVISIONAL pending G1)"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  results_dir: "results"
  logs_dir: "logs"

logging:
  level: "INFO"
  file_name: "solaris_a1.log"

quality:
  # PROVISIONAL quality check thresholds — requires human confirmation (G2)
  cadence_tolerance_factor: 1.5  # PROVISIONAL: delta > 1.5 * expected_cadence flagged as gap
  spike_z_score_threshold: 5.0   # PROVISIONAL: robust MAD z-score for candidate spike detection
  min_zero_run_length: 5         # PROVISIONAL: min consecutive zero counts to record as a zero run
  flag_columns_enabled: false    # PROVISIONAL: flag column parsing disabled until flag semantics confirmed

eda:
  # PROVISIONAL exploratory parameters — exploratory analysis only, no labels or targets
  baseline_span_seconds: 600.0        # PROVISIONAL: running median time span for robust baseline
  burst_threshold_sigma: 5.0          # PROVISIONAL: robust MAD dispersion multiplier for candidate bursts
  burst_min_duration_seconds: 10.0    # PROVISIONAL: min duration above threshold to flag candidate interval
  gallery_max_panels: 9               # PROVISIONAL: max panels to render in candidate burst gallery
  rolling_window_seconds: 60.0        # PROVISIONAL: time-based rolling window for variability statistics

scientific_parameters:
  # All scientific parameters are deferred to student review and decision log
  window_length_s: "PENDING — see docs/01_decision_log.md (D-05)"
  window_stride_s: "PENDING — see docs/01_decision_log.md (D-06)"
  forecast_horizon_s: "PENDING — see docs/01_decision_log.md (D-07)"
  time_tolerance_s: "PENDING — see docs/01_decision_log.md (D-02)"
  energy_channels: "PENDING — see docs/01_decision_log.md (D-09)"
